<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot - Internal Helpdesk</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f7fb;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 10px lightgray;
        }

        h2{
            text-align:center;
            color:#1f4e79;
        }

        input{
            width:100%;
            padding:12px;
            font-size:16px;
            border-radius:8px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            background:#1f4e79;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#163a5c;
        }

        .reply{
            margin-top:25px;
            background:#eef5ff;
            padding:15px;
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🤖 AI Chatbot for Internal Helpdesk</h2>

    <form action="/predict" method="POST">

        <input
            type="text"
            name="message"
            placeholder="Ask your question here..."
            value="{{ user_input if user_input else '' }}"
            required>

        <button type="submit">
            Ask Chatbot
        </button>

    </form>

    {% if user_input %}

    <div class="reply">

        <b>Your Question:</b>

        <br><br>

        {{ user_input }}

        <br><br>

        <b>Chatbot Reply:</b>

        <br><br>

        {{ bot_reply }}

    </div>

    {% endif %}

</div>

</body>
</html>
